<!DOCTYPE html>

<html> <head> <title>User Registration Form</title> <style> body { font-family: Arial, sans-serif; background-color: #f2f2f2; }

    .container {
        width: 350px;
        margin: 50px auto;
        padding: 25px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 10px gray;
    }

    h2 {
        text-align: center;
        color: #333;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        width: 100%;
        padding: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #0056b3;
    }
</style>


</head>

<body>

<div class="container"> <h2>User Registration</h2>

<form onsubmit="return registerUser()">

    <input type="text" id="name"
           placeholder="Enter Full Name" required>

    <input type="email" id="email"
           placeholder="Enter Email" required>

    <input type="password" id="password"
           placeholder="Enter Password" required>

    <input type="password" id="confirmPassword"
           placeholder="Confirm Password" required>

    <button type="submit">Register</button>

</form>


</div>

<script> function registerUser() { let name = document.getElementById("name").value; let email = document.getElementById("email").value; let password = document.getElementById("password").value; let confirmPassword = document.getElementById("confirmPassword").value; if (password !== confirmPassword) { alert("Passwords do not match!"); return false; } alert("Registration Successful!\nWelcome " + name); return false; } </script>

</body> </html>
